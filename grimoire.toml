# Grimoire book configuration for the @deckyard/gemini documentation.

[book]
title = "@deckyard/gemini"
description = "A client for the Google Gemini API: generate content with tools, structured output and thinking, embeddings, files, context caching"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "carbon"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-gemini/"
repoUrl = "https://github.com/deckyard/deck-gemini"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-gemini/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
