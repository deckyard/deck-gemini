[package]
name = "@deckyard/gemini"
version = "0.2.0"
description = "A client for the Google Gemini API: generate content with tools, structured output and thinking, embeddings, files, context caching"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
# It talks to the vendor's HTTPS API, so it opens sockets.
capabilities = ["net"]
keywords = ["gemini", "google", "llm", "ai", "chat", "embeddings", "api"]

[package.urls]
deck = "https://raw.githubusercontent.com/deckyard/deck-gemini/main/deck.toml"
homepage = "https://github.com/deckyard/deck-gemini"
manual = "https://deckyard.github.io/deck-gemini/"

[engines]
jennifer = ">=0.28.0"
